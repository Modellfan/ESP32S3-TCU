; PlatformIO Project Configuration File
;
; Active firmware for LilyGo T-Call A7670 v1.0.
; Files under Inputs/ are reference material only.

[platformio]
description = T-Call A7670 v1.0 GSM/GNSS WiFi console firmware
default_envs = tcall_a7670_v1_0
src_dir = src

[common]
monitor_speed = 115200

[env]
platform = espressif32@6.11.0
framework = arduino
platform_packages = platformio/tool-esptoolpy
board = esp32dev
board_build.filesystem = spiffs
board_build.flash_mode = qio
upload_speed = 115200
monitor_speed = ${common.monitor_speed}
build_flags =
	-D LILYGO_T_CALL_A7670_V1_0
	-D TINY_GSM_MODEM_A76XXSSL
	-D TINY_GSM_RX_BUFFER=1024
	-D MQTT_MAX_PACKET_SIZE=768
lib_deps =
	https://github.com/lewisxhe/TinyGSM-fork
	knolleary/PubSubClient@^2.8

[env:tcall_a7670_v1_0]
build_type = debug
upload_port = COM12
monitor_port = COM12

[env:tcall_a7670_v1_0_ota]
extends = env:tcall_a7670_v1_0
upload_protocol = espota
upload_port = tcall-a7670-v10.local
upload_flags =
	--auth=${sysenv.TCALL_OTA_PASSWORD}
; For OTA uploads with a password, set TCALL_OTA_PASSWORD locally and pass:
;   $env:TCALL_OTA_PASSWORD="your-ota-password"
;   pio run -e tcall_a7670_v1_0_ota -t upload --upload-port <ip-or-hostname>
