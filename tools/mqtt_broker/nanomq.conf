# NanoMQ broker configuration for local ESP32 telemetry tests.

mqtt {
    property_size = 32
    max_packet_size = 1MB
    max_mqueue_len = 2048
    retry_interval = 10s
    keepalive_multiplier = 1.25
}

listeners.tcp {
    bind = "[::]:1883"
}

log {
    to = [file, console]
    level = warn
    dir = "broker-data"
    file = "nanomq.log"
    rotation {
        size = 10MB
        count = 5
    }
}

auth {
    allow_anonymous = true
    no_match = allow
    deny_action = ignore
}

